jenkins:
  systemMessage: "SAST POC: the 'samples' job polls /repos/samples every 2 minutes"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin          # local POC only
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

jobs:
  - script: |
      pipelineJob('samples') {
        description('Scan the samples repo with os-sast and POST the result to ingest-api')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///repos/samples') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
