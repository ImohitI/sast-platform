name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit tests, then ConsumerIT against real Kafka, Postgres and Redis (Testcontainers; the runner has Docker)
      - run: mvn -B verify
